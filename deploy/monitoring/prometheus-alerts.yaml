# Prometheus alert rules for matchmaking Kafka observability (2505-001).
# Tune thresholds via Alertmanager or replace values in your overlay.
groups:
  - name: matchmaking-kafka
    rules:
      - alert: MatchmakingConsumerLagHigh
        expr: kafka_consumergroup_lag{consumergroup=~"matchmaking-.*"} > 1000
        for: 5m
        labels:
          severity: critical
          team: matchmaking
        annotations:
          summary: "Consumer lag exceeds 1000 messages"
          description: "Group {{ $labels.consumergroup }} on topic {{ $labels.topic }} has lag {{ $value }}. See runbook: consumer-lag-spike."

      - alert: MatchmakingConsumerGroupDown
        expr: absent(kafka_consumergroup_members{consumergroup=~"matchmaking-.*"}) or kafka_consumergroup_members{consumergroup=~"matchmaking-.*"} == 0
        for: 2m
        labels:
          severity: critical
          team: matchmaking
        annotations:
          summary: "Matchmaking consumer group has no active members"
          description: "Group {{ $labels.consumergroup }} appears down."

      - alert: MatchmakingProducerErrorRateHigh
        expr: rate(matchmaking_kafka_producer_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          team: matchmaking
        annotations:
          summary: "Elevated Kafka producer error rate"
          description: "Topic {{ $labels.topic }} producer errors are spiking."

      - alert: MatchmakingConsumerErrorRateHigh
        expr: rate(matchmaking_kafka_consumer_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          team: matchmaking
        annotations:
          summary: "Elevated Kafka consumer error rate"
          description: "Topic {{ $labels.topic }} group {{ $labels.group_id }} errors are spiking."

  - name: matchmaking-consistency
    rules:
      - alert: MatchmakingConsistencyDrift
        expr: sum(matchmaking_consistency_drift_current) > 0
        for: 5m
        labels:
          severity: warning
          team: matchmaking
        annotations:
          summary: "Legacy vs new-path consistency drift detected"
          description: "Drift gauge is {{ $value }}. See runbook: consistency-alert."

      - alert: MatchmakingConsistencyCheckFailed
        expr: rate(matchmaking_consistency_checks_total{outcome="error"}[5m]) > 0
        for: 5m
        labels:
          severity: critical
          team: matchmaking
        annotations:
          summary: "Consistency check failing"
          description: "Consistency worker cannot complete checks. See runbook: consistency-alert."

      - alert: MatchmakingConsistencyCheckStale
        expr: time() - matchmaking_consistency_last_check_timestamp_seconds > 300
        for: 2m
        labels:
          severity: critical
          team: matchmaking
        annotations:
          summary: "Consistency check has not run recently"
          description: "Last check was more than 5m ago. Restart consistency-check worker."
